name: Pull Request Audit & Parity Gate

on:
  pull_request:
    branches: [main, master]

jobs:
  pr-governance-audit:
    name: PR Governance & Parity Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Run Core Test Suite
        run: npm test

      - name: Run Pipeline Parity Simulation
        run: |
          node ./bin/run.js pipeline \
            --run \
            --source test/fixtures/profiles \
            --cluster \
            --uap \
            --plan \
            --strict \
            --dry-run
